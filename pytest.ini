[pytest]
testpaths = tests
markers =
    live: calls the real OpenAI API; deselected by default, run with `pytest -m live`
    hindsight_live: calls a real Hindsight server; deselected by default, run with `pytest -m hindsight_live`
# Live tests are deselected unless a -m expression is given on the command line
# (a later -m overrides this one).
addopts = -m "not live and not hindsight_live"
